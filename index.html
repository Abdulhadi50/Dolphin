<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="//libtl.com/sdk.js" data-zone="12001499" data-sdk="show_12001499"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7DB9E8">
<title>ذهب الصحراء</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --sky-top:#7DB9E8;--sky-mid:#B5DFF0;--sky-horizon:#FFE4B5;
  --sand:#E8C588;--sand-light:#F5DEB3;--sand-dark:#C19A6B;--sand-deep:#A57A4F;
  --gold:#FFB800;--gold-bright:#FFD700;--gold-deep:#D97706;--gold-dark:#B45309;
  --terracotta:#C2410C;--terracotta-deep:#7C2D12;
  --cream:#FFFBEB;--cream-2:#FEF3C7;
  --brown-dark:#3E2723;--brown:#5D4037;--brown-mid:#6B4423;--brown-light:#8B6F47;
  --bg-app:linear-gradient(180deg,#7DB9E8 0%,#B5DFF0 22%,#FFE4B5 50%,#F5DEB3 72%,#E8C588 88%,#D4A574 100%);
  --card-bg:rgba(255,251,235,.94);--card-border:rgba(193,154,107,.28);
  --inset:rgba(255,236,179,.55);
  --shadow-sm:0 2px 8px rgba(139,90,43,.1);--shadow-md:0 6px 20px rgba(139,90,43,.14);
  --shadow-gold:0 8px 24px rgba(217,119,6,.28);
  --r-xl:26px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --safe:env(safe-area-inset-bottom,0px);--dock-h:68px;--dock-gap:12px;
  --f-xs:11px;--f-sm:12.5px;--f-base:14px;--f-md:15px;--f-lg:17px;--f-xl:20px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#E8C588;color-scheme:light}html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',-apple-system,sans-serif;background:#E8C588;color:var(--brown-dark);
  font-size:var(--f-base);line-height:1.5;overflow:hidden;direction:rtl;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;color:inherit;font-size:inherit}
img{max-width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
::-webkit-scrollbar{display:none}.main{scrollbar-width:none}
body,.app,.app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}

.app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg-app);overflow:hidden;display:flex;flex-direction:column}
.app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 1.5px,transparent 2px),
  radial-gradient(circle at 80% 30%,rgba(255,255,255,.7) 0 1px,transparent 2px),
  radial-gradient(circle at 40% 45%,rgba(255,255,255,.6) 0 1px,transparent 2px)}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  position:relative;z-index:1;padding:16px 16px calc(var(--dock-h) + var(--dock-gap) + var(--safe) + 30px)}

.view{display:none}
.view.active{display:block;animation:viewIn .28s cubic-bezier(.2,.8,.2,1) both}
.view.leaving{display:block;animation:viewOut .12s ease-in both;pointer-events:none}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes viewOut{from{opacity:1}to{opacity:0}}

.topbar{display:flex;align-items:center;gap:12px;padding:2px 0 18px}
.topbar__meta{flex:1;min-width:0}
.topbar__hello{font-size:12px;font-weight:700;margin-bottom:2px;color:#FFF9C4;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.topbar__name{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:#FFF;
  text-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:linear-gradient(145deg,#FFD700,#FF9800);border:2px solid #FFF;
  box-shadow:0 4px 14px rgba(217,119,6,.4),0 0 0 3px rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:#5D4037;font-size:var(--f-lg);transition:transform .15s}
.avatar:active{transform:scale(.94)}.avatar img{width:100%;height:100%;object-fit:cover}

.chip{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.7);border-radius:30px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(139,90,43,.18),inset 0 1px rgba(255,255,255,.9)}
.chip__body{display:flex;flex-direction:column;line-height:1.1}
.chip__num{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;color:#5D4037}
.chip__cur{font-size:10px;font-weight:800;margin-top:2px;color:var(--gold-deep)}

.star3d{position:relative;flex-shrink:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFF9C4 0%,#FFEB3B 25%,#FFC107 60%,#FF9800 100%);
  border:1.5px solid rgba(255,255,255,.7);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.15),inset 0 2px 4px rgba(255,255,255,.5),0 3px 10px rgba(255,152,0,.4)}
.star3d::before{content:'';position:absolute;left:10%;right:10%;top:8%;height:30%;
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent);border-radius:50%}
.star3d i{position:relative;z-index:1;color:#5D4037;font-size:16px}
.star3d--lg{width:54px;height:54px}.star3d--lg i{font-size:26px}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
.sec-head__title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;color:#FFF;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.sec-head__title i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--gold-deep);
  display:grid;place-items:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sec-head__meta{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.6);padding:5px 13px;border-radius:20px;
  font-size:11.5px;font-weight:800;color:#5D4037;box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* MINING CARD */
.mining-card{position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,251,235,.97),rgba(255,245,220,.95) 50%,rgba(255,240,210,.93));
  border:2px solid rgba(255,193,7,.4);border-radius:28px;padding:20px 16px 18px;margin-bottom:14px;
  box-shadow:0 10px 30px rgba(139,90,43,.16),0 0 0 1px rgba(255,255,255,.6) inset,inset 0 1px rgba(255,255,255,.9)}
.mining-card::before{content:'';position:absolute;top:-90px;right:-90px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,235,59,.35),transparent 65%);pointer-events:none}
.mining-card::after{content:'';position:absolute;bottom:-80px;left:-80px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,152,0,.2),transparent 65%);pointer-events:none}

.plan-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;position:relative;z-index:1}
.plan-header__left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.plan-header__icon{width:62px;height:62px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(145deg,#FFF9C4,#FFD54F);border:2px solid rgba(255,152,0,.5);
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.1),0 4px 14px rgba(255,152,0,.3)}
.plan-header__icon span{animation:planIconFloat 3s ease-in-out infinite;display:block}
@keyframes planIconFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.plan-header__meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.plan-header__lbl{font-size:10.5px;font-weight:700;color:var(--brown-mid)}
.plan-header__name{font-size:var(--f-lg);font-weight:800;color:var(--brown-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-header__reward{display:flex;align-items:center;gap:5px;font-size:var(--f-xs);font-weight:800;color:#FFF;
  background:linear-gradient(135deg,#D97706,#B45309);padding:4px 10px;border-radius:20px;align-self:flex-start;margin-top:2px;
  box-shadow:0 2px 6px rgba(217,119,6,.35)}
.plan-header__reward i{font-size:10px;color:#FFE4B5}
.plan-header__lvl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:18px;flex-shrink:0;min-width:70px;
  background:linear-gradient(145deg,#FFE082,#FFC107);border:1px solid rgba(255,152,0,.4);
  box-shadow:inset 0 1px rgba(255,255,255,.6),0 2px 8px rgba(255,152,0,.25)}
.plan-header__lvl-num{font-size:var(--f-xl);font-weight:800;line-height:1;color:#5D4037;direction:ltr;font-variant-numeric:tabular-nums}
.plan-header__lvl-lbl{font-size:9px;font-weight:800;color:var(--brown-mid)}

/* DESERT SCENE */
.desert-scene{position:relative;width:100%;aspect-ratio:1.15/1;margin:16px auto;z-index:1}
.desert-tank{position:absolute;inset:0;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#4A90E2 0%,#7DB9E8 18%,#B5DFF0 35%,#FFE4B5 55%,#F5DEB3 72%,#E8C588 88%,#C19A6B 100%);
  border:4px solid #FFE4B5;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 -30px 40px rgba(139,90,43,.25),
  0 15px 40px rgba(139,90,43,.3),0 0 0 4px rgba(255,193,7,.15)}

.sun{position:absolute;top:10%;right:12%;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#FFFDE7 0%,#FFF59D 30%,#FFEB3B 60%,#FFC107 100%);
  box-shadow:0 0 40px rgba(255,235,59,.8),0 0 80px rgba(255,193,7,.5),0 0 120px rgba(255,152,0,.3);
  animation:sunPulse 4s ease-in-out infinite;z-index:2}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sun-rays{position:absolute;top:-30%;right:-30%;width:100%;height:100%;
  background:conic-gradient(from 0deg at 80% 30%,transparent 0deg,rgba(255,235,59,.18) 12deg,transparent 24deg,
  rgba(255,235,59,.18) 36deg,transparent 48deg,rgba(255,235,59,.18) 60deg,transparent 72deg,
  rgba(255,235,59,.18) 84deg,transparent 96deg);
  animation:sunRotate 80s linear infinite;z-index:1;pointer-events:none;opacity:.7}
@keyframes sunRotate{to{transform:rotate(360deg)}}

.cloud{position:absolute;background:rgba(255,255,255,.95);border-radius:100px;z-index:3;pointer-events:none;
  box-shadow:0 3px 10px rgba(139,90,43,.12)}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.cloud-1{top:16%;left:-25%;width:80px;height:24px;animation:cloudFloat 32s linear infinite}
.cloud-1::before{top:-12px;left:12px;width:32px;height:32px}
.cloud-1::after{top:-8px;right:12px;width:26px;height:26px}
.cloud-2{top:30%;left:-35%;width:105px;height:28px;animation:cloudFloat 42s linear infinite;animation-delay:-15s;opacity:.85}
.cloud-2::before{top:-14px;left:16px;width:36px;height:36px}
.cloud-2::after{top:-10px;right:16px;width:30px;height:30px}
.cloud-3{top:6%;left:-45%;width:70px;height:22px;animation:cloudFloat 26s linear infinite;animation-delay:-8s;opacity:.7}
.cloud-3::before{top:-10px;left:10px;width:28px;height:28px}
.cloud-3::after{top:-6px;right:10px;width:22px;height:22px}
@keyframes cloudFloat{0%{left:-35%}100%{left:115%}}

.falcon{position:absolute;top:22%;z-index:6;font-size:26px;line-height:1;
  filter:drop-shadow(0 3px 5px rgba(139,90,43,.4));animation:falconFly 18s linear infinite}
@keyframes falconFly{
  0%{left:110%;transform:scaleX(-1) translateY(0)}
  25%{transform:scaleX(-1) translateY(-6px)}
  50%{transform:scaleX(-1) translateY(4px)}
  75%{transform:scaleX(-1) translateY(-4px)}
  100%{left:-10%;transform:scaleX(-1) translateY(0)}}

.pyramids{position:absolute;bottom:28%;left:0;right:0;height:32%;z-index:4;pointer-events:none}
.pyramid{position:absolute;bottom:0;
  background:linear-gradient(135deg,#F5DEB3 0%,#D4A574 45%,#A57A4F 100%);
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  filter:drop-shadow(3px 5px 8px rgba(139,90,43,.45))}
.pyramid::after{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,transparent 40%,rgba(0,0,0,.15) 100%);
  clip-path:inherit}
.pyramid-1{left:6%;width:92px;height:72px;opacity:.88}
.pyramid-2{left:30%;width:130px;height:100px;opacity:1;z-index:1}
.pyramid-3{right:14%;width:74px;height:58px;opacity:.75}

.dune{position:absolute;left:-10%;right:-10%;z-index:5;pointer-events:none}
.dune-back{bottom:0;height:38%;background:linear-gradient(180deg,#F5DEB3 0%,#E8C588 100%);border-radius:70% 50% 0 0/60% 40% 0 0}
.dune-front{bottom:0;height:22%;background:linear-gradient(180deg,#E8C588 0%,#C19A6B 100%);border-radius:50% 60% 0 0/40% 50% 0 0}

.palm{position:absolute;z-index:6;font-size:46px;line-height:1;filter:drop-shadow(2px 5px 7px rgba(139,90,43,.4));
  transform-origin:bottom center;animation:palmSway 5s ease-in-out infinite}
.palm-1{left:3%;bottom:14%;font-size:52px}
.palm-2{right:6%;bottom:12%;font-size:42px;animation-delay:-1.5s}
@keyframes palmSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

.camel{position:absolute;z-index:7;bottom:16%;font-size:34px;line-height:1;
  filter:drop-shadow(2px 4px 6px rgba(139,90,43,.5));animation:camelWalk 22s linear infinite}
@keyframes camelWalk{0%{left:-10%}100%{left:110%}}

.cactus{position:absolute;z-index:6;font-size:24px;line-height:1;filter:drop-shadow(2px 3px 4px rgba(139,90,43,.35))}
.cactus-1{left:38%;bottom:22%}
.cactus-2{right:32%;bottom:19%;font-size:20px;opacity:.8}

.creature{position:absolute;z-index:6;font-size:24px;line-height:1;filter:drop-shadow(0 3px 6px rgba(139,90,43,.4));
  opacity:0;transition:opacity .5s;pointer-events:none}
.creature--5{top:38%;font-size:26px;animation:creatureWalkRight 20s linear infinite;animation-delay:-5s}
.creature--6{top:52%;font-size:22px;animation:creatureWalkLeft 16s linear infinite;animation-delay:-10s}
@keyframes creatureWalkRight{0%{left:-10%;transform:scaleX(-1)}100%{left:110%;transform:scaleX(-1)}}
@keyframes creatureWalkLeft{0%{left:110%}100%{left:-10%}}
.scene.running .creature,.scene.ready .creature{opacity:1}

.bubble{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#FFF9C4 0%,#FFD700 50%,#FFA000 100%);
  box-shadow:0 0 6px rgba(255,193,7,.7);pointer-events:none;z-index:8;
  animation:sandFloat var(--t) linear infinite;animation-delay:var(--d)}
@keyframes sandFloat{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-200px) scale(1.1);opacity:0}}

.gold-coin{position:absolute;bottom:20%;left:50%;font-size:22px;z-index:7;
  animation:goldFloat 3.5s ease-out infinite;opacity:0;animation-delay:var(--d);
  filter:drop-shadow(0 0 8px rgba(255,193,7,.9))}
@keyframes goldFloat{0%{transform:translate(-50%,0) scale(.5) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),-200px) scale(1.2) rotate(360deg);opacity:0}}
.scene.running .gold-coin{opacity:1}

.treasure{position:absolute;bottom:10%;left:50%;transform:translateX(-50%) scale(0);font-size:52px;z-index:9;
  filter:drop-shadow(0 0 20px gold) drop-shadow(0 0 40px rgba(255,193,7,.7));opacity:0;
  transition:transform .8s cubic-bezier(.34,1.56,.64,1),opacity .5s}
.treasure.show{transform:translateX(-50%) scale(1);opacity:1;animation:treasureGlow 1.5s ease-in-out infinite}
@keyframes treasureGlow{0%,100%{filter:drop-shadow(0 0 20px gold) drop-shadow(0 0 40px rgba(255,193,7,.7))}50%{filter:drop-shadow(0 0 30px gold) drop-shadow(0 0 60px rgba(255,193,7,1))}}

.pct{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);padding:6px 16px;border-radius:20px;font-size:12px;font-weight:800;
  border:1.5px solid rgba(255,193,7,.4);z-index:11;color:#5D4037;
  box-shadow:0 4px 12px rgba(139,90,43,.18);font-variant-numeric:tabular-nums}
.pct.ready{background:linear-gradient(135deg,#FFD700,#FFA500);color:#3E2723;border-color:#FF8F00;
  box-shadow:0 4px 16px rgba(255,167,0,.5);display:flex;align-items:center;gap:6px}
.pct.ready::before{content:'\f51e';font-family:'Font Awesome 6 Free';font-weight:900;font-size:11px}

.status-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:16px;
  margin-bottom:var(--sp-3);font-size:var(--f-sm);font-weight:700;background:rgba(255,235,59,.2);
  border:1px solid rgba(255,193,7,.3);color:var(--brown-mid);position:relative;z-index:2}
.status-bar__dot{width:8px;height:8px;border-radius:50%;background:rgba(139,90,43,.5);flex-shrink:0}
.status-bar__dot.active{background:#D97706;animation:dotPulse 1.5s ease-in-out infinite}
.status-bar__dot.ready{background:#B45309;animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}

.timer-bar{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px;border-radius:18px;margin-bottom:var(--sp-3);background:rgba(255,255,255,.85);
  border:1px solid rgba(255,193,7,.3);color:var(--brown-dark);z-index:2;box-shadow:inset 0 1px rgba(255,255,255,.9)}
.timer-bar__ic{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FFE082,#FFC107);
  color:#5D4037;display:flex;align-items:center;justify-content:center;font-size:13px;
  box-shadow:inset 0 1px rgba(255,255,255,.6),0 2px 6px rgba(255,152,0,.25)}
.timer-bar__text{font-size:var(--f-xl);font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;color:var(--brown-dark)}
.timer-bar__lbl{font-size:var(--f-xs);color:var(--brown-mid);font-weight:700;margin-right:2px}

.action{width:100%;padding:16px;border-radius:20px;font-size:var(--f-md);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;
  transition:transform .15s;position:relative;overflow:hidden;z-index:2}
.action:active:not([disabled]){transform:scale(.98)}
.action[disabled]{cursor:not-allowed;opacity:.7}
.action--start{background:linear-gradient(135deg,#FFD700 0%,#FFB800 50%,#FF9800 100%);color:#5D4037;
  box-shadow:0 8px 22px rgba(255,152,0,.4),inset 0 2px rgba(255,255,255,.5),inset 0 -2px rgba(0,0,0,.08);
  border:1px solid rgba(255,255,255,.5)}
.action--start::before{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);
  animation:btnShine 3.2s ease-in-out infinite}
@keyframes btnShine{0%,60%{left:-100%}100%{left:150%}}
.action--stop{background:rgba(255,255,255,.9);color:#C2410C;border:1.5px solid rgba(194,65,12,.4)}
.action--collect{background:linear-gradient(135deg,#FFB300 0%,#FF6F00 100%);color:#FFF;font-size:16.5px;min-height:62px;
  animation:collectPulse 1.6s ease-in-out infinite;border:1px solid rgba(255,255,255,.5);
  box-shadow:0 10px 24px rgba(255,111,0,.4),inset 0 2px rgba(255,255,255,.4)}
.action--collect::before{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);
  animation:btnShine 2.4s ease-in-out infinite}
@keyframes collectPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

.mining-card.is-ready .status-bar{background:rgba(255,193,7,.25);color:#7C2D12;border-color:rgba(255,152,0,.4)}
.mining-card.is-ready .timer-bar{background:rgba(255,235,59,.3);border-color:rgba(255,152,0,.4)}
.mining-card.is-ready .plan-header__lvl{background:linear-gradient(145deg,#FFB300,#FF6F00)}
.mining-card.is-ready .plan-header__lvl-num{color:#FFF}
.mining-card.is-ready .plan-header__lvl-lbl{color:rgba(255,255,255,.9)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;isolation:isolate;text-align:start;border-radius:24px;padding:14px;min-height:140px;
  display:flex;flex-direction:column;gap:3px;transition:transform .15s;border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px rgba(255,255,255,.5),0 6px 18px rgba(139,90,43,.15)}
.tile:active{transform:scale(.98)}
.tile>*{position:relative;z-index:1}
.tile--sea{background:linear-gradient(145deg,#FEF3C7 0%,#FDE68A 60%,#FBBF24 100%);color:#5D4037}
.tile--amber{background:linear-gradient(145deg,#FED7AA 0%,#FDBA74 60%,#F97316 100%);color:#5D4037}
.tile__bg{position:absolute!important;left:-10px;bottom:-16px;font-size:88px;opacity:.15;transform:rotate(-14deg);z-index:0!important;color:#7C2D12}
.tile__ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;
  font-size:17px;margin-bottom:10px;color:#7C2D12;box-shadow:inset 0 1px rgba(255,255,255,.8),0 2px 6px rgba(0,0,0,.08)}
.tile__t{font-size:15px;font-weight:800;color:#5D4037}
.tile__d{font-size:12px;color:#7C2D12;font-weight:600;line-height:1.55}
.tile__d b{font-weight:800;color:#5D4037}
.tile__go{position:absolute!important;top:14px;left:14px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.5);color:#7C2D12;display:grid;place-items:center;font-size:11px;
  box-shadow:inset 0 1px rgba(255,255,255,.7)}

.wheel-tile{position:relative;overflow:hidden;isolation:isolate;width:100%;margin-top:10px;border-radius:24px;
  padding:18px 16px;min-height:88px;background:linear-gradient(135deg,#FFD700 0%,#FF9800 100%);
  display:flex;align-items:center;gap:14px;transition:transform .15s;text-align:start;
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 24px rgba(255,152,0,.3)}
.wheel-tile:active{transform:scale(.98)}
.wheel-tile::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);pointer-events:none;z-index:0}
.wheel-tile>*{position:relative;z-index:1}
.wheel-tile__ic{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;
  font-size:26px;flex-shrink:0;border:2px solid rgba(255,255,255,.6);box-shadow:inset 0 2px rgba(255,255,255,.5)}
.wheel-tile__body{flex:1;min-width:0}
.wheel-tile__t{font-size:16px;font-weight:800;color:#5D4037;margin-bottom:3px}
.wheel-tile__d{font-size:12px;color:rgba(93,64,55,.85);font-weight:600;line-height:1.5}
.wheel-tile__badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  background:rgba(255,255,255,.85);color:#B45309;font-size:10.5px;font-weight:800;margin-top:6px}
.wheel-tile__arrow{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.5);color:#7C2D12;
  display:grid;place-items:center;font-size:13px;flex-shrink:0}

/* CARDS */
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:26px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card__title{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;margin-bottom:12px;color:var(--brown-dark)}
.card__title i{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#FFE082,#FFC107);color:#5D4037;
  display:grid;place-items:center;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.6)}
.card__sep{height:1px;background:rgba(193,154,107,.25);margin:14px 0}
.rwd{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;
  background:rgba(255,214,10,.2);color:#7C2D12;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0;
  border:1px solid rgba(255,193,7,.35)}
.rwd i{font-size:11px;color:#D97706}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:rgba(255,255,255,.7);
  border:1px solid var(--card-border);border-radius:20px;padding:4px;margin-bottom:14px}
.seg__b{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border-radius:16px;
  font-size:13px;font-weight:800;color:var(--brown-mid);transition:background .25s,color .25s}
.seg__b.active{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;box-shadow:0 4px 12px rgba(255,152,0,.3)}

.icon-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;
  display:grid;place-items:center;font-size:14px;flex-shrink:0;transition:transform .15s;box-shadow:0 3px 10px rgba(255,152,0,.3)}
.icon-btn:active{transform:scale(.92)}
.wavy{position:relative;overflow:hidden;isolation:isolate}
.wavy>*{position:relative;z-index:2}

.ring{position:relative;width:76px;height:76px;flex-shrink:0;--rb:rgba(255,255,255,.4);--rf:#FFD700;color:#5D4037}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring__bg{stroke:var(--rb)}
.ring__fg{stroke:var(--rf);stroke-dasharray:213.63;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring__n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr;line-height:1.05}
.ring__n b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ring__n small{font-size:10.5px;font-weight:700;opacity:.7}
.ring--lg{width:96px;height:96px}
.ring--lg .ring__n b{font-size:26px}

.qb{display:flex;align-items:center;gap:16px;padding:18px 16px 26px;border-radius:24px;
  background:linear-gradient(145deg,#FFD700 0%,#FF9800 100%);color:#5D4037;margin-bottom:18px;
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 24px rgba(255,152,0,.25)}
.qb__t{font-size:16px;font-weight:800;color:#3E2723}
.qb__s{font-size:12.5px;font-weight:600;color:#7C2D12;margin:3px 0 10px}
.qb__left{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
  background:rgba(255,255,255,.6);font-size:12px;font-weight:700;color:#5D4037}
.qb__left b{color:#7C2D12;font-weight:800}
.qb__left i{color:#B45309}
.qb .ring{--rb:rgba(255,255,255,.55);--rf:#7C2D12}

.grp{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;
  font-size:13.5px;font-weight:800;color:#FFF;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.grp:first-child{margin-top:0}
.grp small{font-size:11.5px;font-weight:700;color:#FEF3C7;text-shadow:0 1px 3px rgba(0,0,0,.3)}

.hint{display:flex;align-items:flex-start;gap:8px;padding:11px 13px;border-radius:16px;
  background:rgba(255,235,59,.2);border:1px solid rgba(255,193,7,.35);color:var(--brown-mid);
  font-size:12px;font-weight:600;line-height:1.65;margin-bottom:12px}
.hint i{margin-top:3px;font-size:12px;color:#D97706}
.hint b{color:#7C2D12}

.cq{display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#FEF3C7,#FDE68A);
  border:1px solid rgba(255,193,7,.4);border-radius:22px;padding:14px;margin-bottom:10px;
  box-shadow:inset 0 1px rgba(255,255,255,.6)}
.cq__ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.7);color:#5D4037;
  display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:inset 0 1px rgba(255,255,255,.8),0 2px 6px rgba(0,0,0,.08)}
.cq__info{flex:1;min-width:0}
.cq__t{font-size:14.5px;font-weight:800;line-height:1.4;word-break:break-word;color:var(--brown-dark)}
.cq__d{font-size:12px;color:var(--brown-mid);font-weight:600;margin:2px 0 7px;line-height:1.5}
.cq__btn{flex-shrink:0;min-height:44px;padding:0 18px;border-radius:16px;font-size:13px;font-weight:800;
  display:inline-flex;align-items:center;gap:7px;transition:transform .15s}
.cq__btn:active:not([disabled]){transform:scale(.96)}
.cq__btn--join{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;box-shadow:0 3px 10px rgba(255,152,0,.3)}
.cq__btn--collect{background:linear-gradient(135deg,#FFB300,#FF6F00);color:#FFF;animation:collectPulse 1.6s ease-in-out infinite}
.cq__btn--done{background:rgba(139,90,43,.15);color:var(--brown-mid);cursor:default}
.cq.is-done{background:linear-gradient(145deg,#DCFCE7,#BBF7D0);border-color:rgba(21,128,61,.3)}
.cq.is-done .cq__ic{background:rgba(21,128,61,.2);color:#15803D}

.fq{position:relative;overflow:hidden;border-radius:26px;padding:16px;
  background:linear-gradient(145deg,#FEF3C7 0%,#FDE68A 100%);border:1px solid rgba(255,193,7,.4);
  margin-bottom:10px;box-shadow:inset 0 1px rgba(255,255,255,.6),0 4px 14px rgba(139,90,43,.1)}
.fq--ready{background:linear-gradient(145deg,#FFD700 0%,#FF9800 100%);border-color:rgba(255,255,255,.5);
  box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 24px rgba(255,152,0,.3)}
.fq--ready .ring{--rf:#FFF;--rb:rgba(255,255,255,.4)}
.fq--ready::after{content:'';position:absolute;top:-70px;left:-70px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 68%);pointer-events:none}
.fq--all{text-align:center;padding:24px 16px}
.fq__top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:relative;z-index:2}
.fq__badge{padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.6);font-size:12px;font-weight:800;color:#7C2D12}
.fq--ready .fq__badge{background:rgba(255,255,255,.9);color:#5D4037}
.fq__body{display:flex;align-items:center;gap:16px;position:relative;z-index:2}
.fq__txt{flex:1;min-width:0}
.fq__t{font-size:17px;font-weight:800;line-height:1.35;color:var(--brown-dark)}
.fq--ready .fq__t{color:#3E2723}
.fq__d{font-size:12.5px;color:var(--brown-mid);font-weight:600;line-height:1.6;margin-top:3px}
.fq--ready .fq__d{color:#5D4037}
.fq__left{display:inline-block;margin-top:9px;padding:4px 11px;border-radius:20px;
  background:rgba(255,255,255,.7);font-size:12px;font-weight:800;color:#7C2D12}
.fq--ready .fq__left{color:#7C2D12}
.fq__btn{width:100%;min-height:52px;margin-top:16px;border-radius:18px;font-size:14.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s;position:relative;z-index:2}
.fq__btn:active{transform:scale(.98)}
.fq__btn--go{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;box-shadow:0 4px 12px rgba(255,152,0,.3)}
.fq__btn--collect{background:linear-gradient(135deg,#FFB300,#FF6F00);color:#FFF;
  animation:collectPulse 1.6s ease-in-out infinite;box-shadow:0 6px 18px rgba(255,111,0,.4)}
.fq__ok{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#4ADE80,#15803D);color:#FFF;
  display:grid;place-items:center;font-size:24px;margin:0 auto 12px;box-shadow:0 4px 12px rgba(21,128,61,.4)}

.qrow{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:linear-gradient(145deg,#FEF3C7,#FDE68A);border:1px solid rgba(255,193,7,.35);
  border-radius:20px;margin-bottom:8px;box-shadow:inset 0 1px rgba(255,255,255,.6)}
.qrow__ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);color:#5D4037;
  display:grid;place-items:center;font-size:15px;flex-shrink:0;box-shadow:inset 0 1px rgba(255,255,255,.8)}
.qrow__info{flex:1;min-width:0}
.qrow__t{font-size:14px;font-weight:800;color:var(--brown-dark)}
.qrow__d{font-size:11.5px;color:var(--brown-mid);font-weight:600;margin-top:1px;word-break:break-all}
.qrow--done{background:linear-gradient(145deg,#DCFCE7,#BBF7D0);border-color:rgba(21,128,61,.3)}
.qrow--done .qrow__ic{background:rgba(21,128,61,.2);color:#15803D}
.qrow--done .qrow__t{color:var(--brown-mid)}
.qrow--lock{background:rgba(255,251,235,.7);border:1px dashed rgba(193,154,107,.5)}
.qrow--lock .qrow__ic{background:rgba(193,154,107,.2);color:#8B6F47}
.qrow--lock .qrow__t{color:var(--brown)}
.qrow--lock .qrow__d{color:var(--brown-light)}
.qrow--lock .rwd{background:rgba(193,154,107,.2);color:#8B6F47;border-color:rgba(193,154,107,.35)}
.qrow--lock .rwd i{color:#8B6F47}

/* PLANS */
.plans-grid{display:flex;flex-direction:column;gap:12px}
.plan{background:var(--card-bg);border:1px solid var(--card-border);border-radius:28px;padding:16px;
  position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.plan--current{outline:2.5px solid var(--gold-deep);outline-offset:-2.5px;
  box-shadow:var(--shadow-gold),0 0 0 4px rgba(217,119,6,.1)}
.plan__top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.plan__icon{width:60px;height:60px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:32px;line-height:1;background:linear-gradient(145deg,#FFF9C4,#FFD54F);border:1.5px solid rgba(255,152,0,.4);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.1),0 3px 10px rgba(255,152,0,.25)}
.plan__icon span{animation:planIconFloat 3s ease-in-out infinite;display:block}
.plan__head{flex:1;min-width:0}
.plan__name{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;color:var(--brown-dark)}
.plan__badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.plan__badge--current{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037}
.plan__badge--next{background:rgba(255,193,7,.2);color:#B45309}
.plan__badge--locked{background:rgba(193,154,107,.2);color:var(--brown-mid)}
.plan__desc{font-size:12px;color:var(--brown-mid);font-weight:600}
.plan__stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.plan__stat{background:rgba(255,255,255,.6);border:1px solid rgba(193,154,107,.25);border-radius:16px;
  padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.plan__stat-lbl{font-size:11px;color:var(--brown-mid);font-weight:700;display:flex;align-items:center;gap:5px}
.plan__stat-lbl i{font-size:10.5px}
.plan__stat-val{font-size:15px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;text-align:right;color:var(--gold-deep)}
.plan__bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;
  border-top:1px solid rgba(193,154,107,.25)}
.plan__price{display:flex;flex-direction:column;gap:2px}
.plan__price-lbl{font-size:10.5px;color:var(--brown-mid);font-weight:700}
.plan__price-val{font-size:15.5px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;color:var(--gold-deep)}
.plan__btn{min-height:46px;padding:0 20px;border-radius:16px;font-size:13px;font-weight:800;
  display:flex;align-items:center;gap:7px;white-space:nowrap;transition:transform .15s}
.plan__btn--buy{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;box-shadow:0 4px 12px rgba(255,152,0,.3)}
.plan__btn--buy:active{transform:scale(.96)}
.plan__btn--current{background:rgba(139,90,43,.15);color:var(--brown-mid);cursor:default}
.plan__btn--locked{background:rgba(139,90,43,.1);color:var(--brown-light);cursor:not-allowed}
.plan__timer{background:rgba(255,255,255,.7);border:1px solid rgba(193,154,107,.25);border-radius:18px;
  padding:12px;margin-bottom:14px}
.plan__timer-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;
  color:var(--brown-mid);margin-bottom:10px}
.plan__timer-head i{margin-left:4px;color:var(--gold-deep)}
.plan__timer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbox{background:rgba(255,251,235,.9);border:1px solid rgba(193,154,107,.2);border-radius:14px;padding:8px 4px;text-align:center}
.tbox b{display:block;font-size:20px;font-weight:800;color:var(--gold-deep);
  font-variant-numeric:tabular-nums;line-height:1.1;direction:ltr}
.tbox small{font-size:10.5px;color:var(--brown-mid);font-weight:700}
.plan__timer-bar{height:6px;background:rgba(193,154,107,.25);border-radius:6px;overflow:hidden;margin-top:10px}
.plan__timer-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF9800,#FFD700);
  border-radius:6px;transition:width .6s}
.plan__cancel{width:100%;margin-top:12px;min-height:46px;border-radius:16px;background:rgba(255,255,255,.85);
  color:#C2410C;border:1.5px solid rgba(194,65,12,.35);font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px}
.plan__cancel:active{transform:scale(.98)}
.plan__cancel-note{font-size:11px;color:var(--brown-mid);text-align:center;margin-top:7px;font-weight:600}

/* PLANS REPORT */
.plans-report{margin-top:16px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm)}
.plans-report__head{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;border-bottom:1px solid rgba(193,154,107,.2)}
.plans-report__title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--brown-dark)}
.plans-report__title i{width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,#FFE082,#FFC107);
  color:#5D4037;display:grid;place-items:center;font-size:11px}
.plans-report__tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;
  background:rgba(255,193,7,.2);color:#B45309;letter-spacing:.5px}
.plans-table{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
.plans-table thead th{padding:8px 3px;font-size:9.5px;font-weight:800;color:var(--brown-mid);text-align:center;
  background:rgba(255,248,230,.7);border-bottom:1px solid rgba(193,154,107,.2);white-space:nowrap}
.plans-table thead th:first-child{text-align:start;padding-inline-start:10px;width:26%}
.plans-table tbody tr{border-bottom:1px solid rgba(193,154,107,.15)}
.plans-table tbody tr:last-child{border-bottom:none}
.plans-table tbody tr.is-current{background:rgba(255,214,10,.15)}
.plans-table td{padding:9px 3px;text-align:center;font-weight:700;color:var(--brown-dark);
  font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap;font-size:11px}
.plans-table td:first-child{text-align:start;padding-inline-start:10px;direction:rtl}
.pt-plan{display:flex;align-items:center;gap:6px}
.pt-plan__icon{font-size:15px;flex-shrink:0;line-height:1}
.pt-plan__name{font-size:11px;font-weight:800;color:var(--brown-dark);display:flex;align-items:center;gap:4px;white-space:nowrap}
.pt-plan__lvl{font-size:8px;font-weight:800;padding:1px 5px;border-radius:8px;background:rgba(255,193,7,.25);color:#B45309}
.pt-price{color:#D97706!important;font-size:10.5px!important}
.pt-total{color:#15803D!important;font-weight:800!important;font-size:10.5px!important}

/* FIELDS */
.field{margin-bottom:14px}
.field__label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:8px;color:var(--brown-dark)}
.field__label i{width:24px;height:24px;border-radius:50%;background:rgba(255,193,7,.2);color:#B45309;
  display:grid;place-items:center;font-size:10.5px}
.field__input{width:100%;height:54px;padding:0 16px;border:1.5px solid rgba(193,154,107,.35);
  border-radius:18px;background:rgba(255,255,255,.85);color:var(--brown-dark);font-weight:600;
  outline:2px solid transparent;outline-offset:0;transition:outline-color .2s,background .2s,border-color .2s}
.field__input:focus{outline-color:#FFB800;background:#FFF;border-color:transparent}
.field__input::placeholder{color:rgba(139,90,43,.55);font-weight:500}
.field__input--ltr{direction:ltr;text-align:left}
.field__input--code{text-align:center;letter-spacing:3px;font-weight:800;font-size:17px}
select.field__input{-webkit-appearance:none;appearance:none;cursor:pointer}
.msg{display:none;padding:10px 14px;border-radius:14px;font-size:12.5px;font-weight:700;
  margin-top:10px;text-align:center;background:rgba(255,255,255,.85);border:1px solid rgba(193,154,107,.3)}
.msg.show{display:block}
.msg--ok{color:#15803D;background:rgba(220,252,231,.85);border-color:rgba(21,128,61,.3)}
.msg--err{color:#B91C1C;background:rgba(254,226,226,.85);border-color:rgba(185,28,28,.3)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;min-height:54px;
  border-radius:20px;font-size:14.5px;font-weight:800;transition:transform .15s}
.btn:active:not([disabled]){transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn--primary,.btn--sea{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;
  box-shadow:0 6px 18px rgba(255,152,0,.3),inset 0 2px rgba(255,255,255,.4)}
.btn--outline{background:rgba(255,255,255,.85);color:var(--brown-dark);border:1px solid rgba(193,154,107,.3)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:18px;
  font-size:12.5px;font-weight:600;line-height:1.75;margin-bottom:14px;
  background:rgba(255,235,59,.18);border:1px solid rgba(255,193,7,.35);color:var(--brown-mid)}
.alert i{margin-top:4px;flex-shrink:0;font-size:13px;color:#D97706}
.alert--warn i{color:#B45309}
.alert--danger{background:rgba(254,226,226,.7);border-color:rgba(185,28,28,.3)}
.alert--danger i{color:#B91C1C}
.alert b{font-weight:800;color:var(--brown-dark)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.75);
  border:1px solid var(--card-border);border-radius:20px;padding:4px;margin-bottom:14px}
.tab{padding:12px 10px;border-radius:16px;font-size:13px;font-weight:800;color:var(--brown-mid);
  display:flex;align-items:center;justify-content:center;gap:7px;transition:background .25s,color .25s}
.tab.active{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;box-shadow:0 4px 12px rgba(255,152,0,.3)}

#panelWithdraw{background:var(--card-bg);border:1px solid var(--card-border);border-radius:28px;
  padding:16px;box-shadow:var(--shadow-sm)}
#panelWithdraw .sec-head{margin-bottom:12px}
#panelWithdraw .sec-head__title{color:var(--brown-dark);text-shadow:none}
#panelWithdraw .sec-head__title i,.step .sec-head__title i{background:linear-gradient(145deg,#FFE082,#FFC107);color:#5D4037}

.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.method{position:relative;padding:12px;border:1.5px solid rgba(193,154,107,.3);border-radius:20px;
  background:rgba(255,255,255,.7);cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:background .2s,border-color .2s}
.method:active{transform:scale(.98)}
.method--active{background:linear-gradient(135deg,#FFF8E7,#FFE8B0);border-color:#FFB800;
  box-shadow:0 0 0 2px rgba(255,184,0,.15),0 3px 10px rgba(255,152,0,.2)}
.method__check{position:absolute;top:8px;left:8px;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#FFD700,#FF9800);display:none;align-items:center;justify-content:center;
  color:#5D4037;font-size:9px}
.method--active .method__check{display:flex}
.method__logo{width:40px;height:40px;border-radius:50%;background:#FFF;display:flex;align-items:center;
  justify-content:center;padding:6px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.method__logo img{width:100%;height:100%;object-fit:contain}
.method__name{font-size:12.5px;font-weight:800;direction:ltr;color:var(--brown-dark)}

.info-rows{background:rgba(255,255,255,.7);border:1px solid rgba(193,154,107,.25);border-radius:18px;
  padding:6px 14px;margin-bottom:16px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12.5px}
.info-row+.info-row{border-top:1px solid rgba(193,154,107,.2)}
.info-row__lbl{color:var(--brown-mid);font-weight:600;display:flex;align-items:center;gap:6px}
.info-row__val{font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;color:var(--brown-dark)}
.info-row__val--sea{color:var(--brown-dark)}
.info-row__val--amber{color:#D97706}
.info-row__val--muted{color:var(--brown-mid)}

.step{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--card-bg);
  border:1px solid var(--card-border);border-radius:28px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.step__num{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FFD700,#FF9800);
  color:#5D4037;display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0;
  box-shadow:0 3px 10px rgba(255,152,0,.3)}
.step__body{flex:1;min-width:0}
.step__title{font-size:14.5px;font-weight:800;margin-bottom:4px;color:var(--brown-dark)}
.step__desc{font-size:12.5px;color:var(--brown-mid);line-height:1.7;margin-bottom:12px;font-weight:500}
.id-box{background:rgba(255,248,230,.9);border:1.5px dashed rgba(193,154,107,.6);border-radius:16px;
  padding:14px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:800;
  color:var(--brown-dark);direction:ltr;letter-spacing:3px;word-break:break-all;margin-bottom:10px}

.rf-hero{border-radius:26px;padding:20px 16px 30px;margin-bottom:12px;
  background:linear-gradient(145deg,#FFD700 0%,#FF9800 100%);color:#5D4037;
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 24px rgba(255,152,0,.25)}
.rf-hero__top{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.rf-hero__ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center;
  font-size:21px;flex-shrink:0;box-shadow:inset 0 1px rgba(255,255,255,.6)}
.rf-hero__title{font-size:18.5px;font-weight:800;line-height:1.35;margin-bottom:4px;color:#3E2723}
.rf-hero__desc{font-size:12.5px;line-height:1.75;color:rgba(62,39,35,.8);font-weight:600}
.rf-hero__rewards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rf-hero__rw{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.4);border-radius:20px;
  padding:12px 10px;text-align:center}
.rf-hero__rw .amt{font-size:26px;font-weight:800;color:#7C2D12;direction:ltr;line-height:1}
.rf-hero__rw .lbl{font-size:11.5px;font-weight:700;margin-top:6px;color:#5D4037}

.rf-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rf-stat{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:24px;padding:14px;box-shadow:var(--shadow-sm)}
.rf-stat__ic{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#FFE082,#FFC107);
  color:#5D4037;display:grid;place-items:center;font-size:17px;flex-shrink:0;box-shadow:inset 0 1px rgba(255,255,255,.6)}
.rf-stat__ic--amber{background:linear-gradient(145deg,#FFD700,#FF9800)}
.rf-stat__num{font-size:22px;font-weight:800;line-height:1.1;direction:ltr;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--brown-dark)}
.rf-stat__lbl{font-size:11.5px;color:var(--brown-mid);font-weight:600;margin-top:3px}

.ref-link{background:rgba(255,248,230,.9);border:1px solid rgba(193,154,107,.3);border-radius:16px;
  padding:12px 14px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;
  word-break:break-all;margin-bottom:12px;line-height:1.6;font-weight:600;color:var(--brown-dark)}
.ref-actions{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}

.code-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,248,230,.9);border:1.5px dashed rgba(193,154,107,.5);border-radius:18px;padding:12px 14px}
.code-row__lbl{font-size:11.5px;color:var(--brown-mid);font-weight:700;margin-bottom:2px}
.code-row__val{font-family:var(--mono);font-size:20px;font-weight:800;direction:ltr;letter-spacing:3px;
  text-align:right;color:var(--brown-dark)}

.how{display:flex;flex-direction:column;gap:14px}
.how__row{display:flex;align-items:flex-start;gap:12px}
.how__n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FFD700,#FF9800);
  color:#5D4037;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;
  box-shadow:0 2px 6px rgba(255,152,0,.3)}
.how__t{font-size:13.5px;font-weight:800;line-height:1.5;color:var(--brown-dark)}
.how__d{font-size:12px;color:var(--brown-mid);font-weight:500;line-height:1.6;margin-top:1px}

.lb{background:var(--card-bg);border:1px solid var(--card-border);border-radius:28px;overflow:hidden;
  margin-bottom:12px;box-shadow:var(--shadow-sm)}
.lb__head{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between}
.lb__title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;color:var(--brown-dark)}
.lb__title i{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#FFE082,#FFC107);
  color:#5D4037;display:grid;place-items:center;font-size:12px}
.lb__tag{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:20px;
  background:rgba(255,193,7,.2);color:#B45309}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:8px;align-items:end;padding:16px 12px 0;
  direction:ltr;background:rgba(255,248,230,.5)}
.pod{display:flex;flex-direction:column;align-items:center;min-width:0;direction:rtl;--rc:#8B6F47}
.pod--1{--rc:#FFB800}.pod--2{--rc:#A57A4F}.pod--3{--rc:#D97706}
.pod__crown{height:22px;color:#FFB800;font-size:18px;line-height:22px}
.pod__av{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#FEF3C7,#FDE68A);
  border:3px solid var(--rc);display:grid;place-items:center;overflow:hidden;color:var(--brown-mid);font-size:18px}
.pod--1 .pod__av{width:70px;height:70px;font-size:22px}
.pod__av img{width:100%;height:100%;object-fit:cover}
.pod__name{display:flex;align-items:center;justify-content:center;gap:4px;max-width:100%;margin-top:8px;
  font-size:12.5px;font-weight:800;color:var(--brown-dark)}
.pod__name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pod__cnt{font-size:11.5px;color:var(--brown-mid);font-weight:700;margin-top:1px}
.pod__cnt b{color:var(--brown-dark);font-weight:800}
.pod__base{width:100%;margin-top:8px;border-radius:16px 16px 0 0;display:grid;place-items:center;
  font-size:22px;font-weight:800;color:#FFF;background:var(--rc);box-shadow:inset 0 2px rgba(255,255,255,.3)}
.pod--1 .pod__base{height:72px}.pod--2 .pod__base{height:54px}.pod--3 .pod__base{height:42px}
.pod--empty{opacity:.45}
.lb__list{padding:10px 8px 8px;background:transparent}
.lrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px}
.lrow--me{background:rgba(255,193,7,.15)}
.lrow__rank{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FFD700,#FF9800);
  color:#5D4037;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.lrow__av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#FEF3C7,#FDE68A);
  display:grid;place-items:center;overflow:hidden;color:var(--brown-mid);font-size:14px;flex-shrink:0}
.lrow__av img{width:100%;height:100%;object-fit:cover}
.lrow__info{flex:1;min-width:0}
.lrow__name{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--brown-dark)}
.lrow__name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lrow__cnt{font-size:12px;color:#FFF;font-weight:800;background:linear-gradient(135deg,#FFB800,#D97706);
  padding:4px 11px;border-radius:20px;white-space:nowrap}
.me-tag{font-size:9.5px;font-weight:800;background:#FFD700;color:#5D4037;padding:1px 7px;
  border-radius:10px;flex-shrink:0;font-style:normal}
.lb__empty{padding:28px 16px;text-align:center;color:var(--brown-mid)}
.lb__empty i{font-size:38px;display:block;margin-bottom:10px;opacity:.5}
.lb__empty p{font-size:13px;font-weight:600}

/* PROFILE */
.pf-top{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:26px 16px 22px;margin-bottom:14px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow-sm)}
.pf-top::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(circle at 20% 20%,rgba(255,193,7,.4) 0 2px,transparent 3px),
  radial-gradient(circle at 80% 30%,rgba(255,193,7,.3) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 50% 70%,rgba(255,193,7,.25) 0 1px,transparent 2px);
  background-size:80px 80px,120px 120px,100px 100px}
.pf-top>*{position:relative;z-index:1}
.pf-av{width:118px;height:118px;border-radius:50%;border:3px solid #FFB800;padding:5px;
  display:grid;place-items:center;overflow:hidden;margin-bottom:14px;color:#7C2D12;font-size:44px;
  background:rgba(255,193,7,.15);box-shadow:0 0 0 6px rgba(255,193,7,.1),0 8px 20px rgba(255,152,0,.25)}
.pf-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pf-name{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  font-size:22px;font-weight:800;color:var(--brown-dark);word-break:break-word;margin-bottom:12px}
.pf-id{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:30px;
  background:rgba(255,248,230,.9);border:1px solid rgba(193,154,107,.3);color:var(--brown-dark);
  font-weight:700;transition:transform .15s}
.pf-id:active{transform:scale(.97)}
.pf-id span{font-family:var(--mono);font-size:14.5px;font-weight:800;letter-spacing:2px;direction:ltr}
.pf-id i{font-size:13px;color:#D97706}

.pf-bal{display:flex;align-items:center;gap:14px;background:linear-gradient(145deg,#FFD700 0%,#FF9800 100%);
  border-radius:26px;padding:18px 16px 26px;margin-bottom:10px;color:#5D4037;
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 24px rgba(255,152,0,.25)}
.pf-bal__lbl{font-size:12px;font-weight:700;color:rgba(62,39,35,.8)}
.pf-bal__row{display:flex;align-items:baseline;gap:6px}
.pf-bal__val{font-size:34px;font-weight:800;line-height:1.15;direction:ltr;font-variant-numeric:tabular-nums;color:#3E2723}
.pf-bal__cur{font-size:13px;font-weight:800;color:#7C2D12}

.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pf-cell{position:relative;overflow:hidden;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:104px;
  box-shadow:var(--shadow-sm)}
.pf-cell__ic{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#FFE082,#FFC107);
  color:#5D4037;display:grid;place-items:center;font-size:14px;margin-bottom:6px;
  box-shadow:inset 0 1px rgba(255,255,255,.6)}
.pf-cell__lbl{font-size:11.5px;font-weight:600;color:var(--brown-mid)}
.pf-cell__val{font-size:19px;font-weight:800;direction:ltr;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--brown-dark)}
.pf-cell__val--txt{direction:rtl;font-size:17px}
.pf-cell__bg{position:absolute;left:-8px;bottom:-14px;font-size:70px;opacity:.1;transform:rotate(-12deg);
  pointer-events:none;color:#D97706}

.pf-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card-bg);
  border:1px solid var(--card-border);border-radius:24px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.pf-row__ic{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#FFE082,#FFC107);
  color:#5D4037;display:grid;place-items:center;font-size:14px;flex-shrink:0;
  box-shadow:inset 0 1px rgba(255,255,255,.6)}
.pf-row__lbl{flex:1;font-size:13.5px;font-weight:600;color:var(--brown-mid)}
.pf-row__val{font-size:14px;font-weight:800;color:var(--brown-dark)}

/* DOCK */
.dock{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-gap) + var(--safe));z-index:50;
  display:flex;align-items:center;gap:10px;pointer-events:none}
.nav{pointer-events:auto;flex:1;min-width:0;height:var(--dock-h);border-radius:36px;padding:6px;
  background:rgba(255,251,235,.96);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 10px 30px rgba(139,90,43,.25),inset 0 1px rgba(255,255,255,.9)}
.nav__inner{display:flex;align-items:stretch;height:100%;gap:2px}
.nav .nav__btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border-radius:30px;color:rgba(107,68,35,.65);font-weight:700;
  transition:background .25s,color .25s,transform .15s}
.nav .nav__btn i{font-size:23px;line-height:1}
.nav .nav__btn span{font-size:10.5px;line-height:1.1;white-space:nowrap}
.nav .nav__btn:active{transform:scale(.94)}
.nav .nav__btn--active{background:linear-gradient(135deg,#FFD700,#FF9800);color:#5D4037;
  box-shadow:0 4px 12px rgba(255,152,0,.35),inset 0 1px rgba(255,255,255,.6)}
.nav__profile{pointer-events:auto;flex-shrink:0;width:var(--dock-h);height:var(--dock-h);border-radius:50%;
  padding:5px;overflow:hidden;background:rgba(255,251,235,.96);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.8);
  transition:border-color .25s,transform .15s;display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(139,90,43,.25),inset 0 1px rgba(255,255,255,.9)}
.nav__profile:active{transform:scale(.94)}
.nav__profile.nav__btn--active{border:2.5px solid #FFB800;box-shadow:0 0 0 3px rgba(255,184,0,.2),0 6px 20px rgba(255,152,0,.3)}
.nav__av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  color:#5D4037;font-size:24px;background:linear-gradient(145deg,#FFE082,#FFC107)}
.nav__av img{width:100%;height:100%;object-fit:cover}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-140%);opacity:0;
  background:rgba(255,251,235,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:#3E2723;border:1px solid rgba(255,193,7,.4);padding:12px 18px;border-radius:30px;
  font-size:var(--f-sm);font-weight:700;z-index:9000;max-width:92%;display:flex;align-items:center;gap:10px;
  transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .3s;pointer-events:none;
  box-shadow:0 10px 30px rgba(139,90,43,.25)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast__ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0}
.toast--ok .toast__ic{background:rgba(21,128,61,.2);color:#15803D}
.toast--err .toast__ic{background:rgba(185,28,28,.2);color:#B91C1C}
.toast--info .toast__ic{background:rgba(217,119,6,.2);color:#D97706}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tamper-overlay{position:fixed;inset:0;z-index:9000;background:rgba(62,39,35,.75);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;align-items:center;
  justify-content:center;padding:20px}
